<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      ?v=2 since the new icon (1.10.0): browsers had kept the old icons, served
      without a cache header, and kept showing them. A new address passes that
      entry by. Raise the number with a new icon, here and in the manifest.
    -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Als Web-App installierbar. Vite macht beim Bauen aus "/…" ein "./…", und das <base href>, das der Server
      einsetzt, fuehrt es unter einem Unterpfad (NEXCRATE_URL_BASE) an die richtige Stelle. Im Manifest stehen
      start_url und scope relativ und tragen den Unterpfad so von selbst.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Ohne diese Zeilen oeffnet iOS die App vom Home-Bildschirm als gewoehnlichen Safari-Reiter. Die
         Apple-Schreibweise bleibt neben der allgemeinen: Safari liest nur sie, Chrome will beide. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="nexcrate" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#0b0b0f" />
    <title>nexcrate</title>
    <!-- Vor dem ersten Zeichnen: sonst blitzt bei "hell" kurz die dunkle Seite auf. -->
    <script>
      try {
        if (localStorage.getItem('nexcrate.theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.querySelector('meta[name="theme-color"]').content = '#f5f5f8';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
