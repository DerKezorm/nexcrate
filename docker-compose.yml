# nexcrate, start with:  docker compose up -d
#
# Then open http://<your-host>:8390 and create the account.
#
# To build from source instead of pulling the image, comment out `image:` and
# uncomment `build: .`.
#
# ⚠️ Whoever reaches a fresh installation first can create the account and owns it.
# Do not make the port reachable from the internet before the account exists.

services:
  nexcrate:
    image: ghcr.io/derkezorm/nexcrate:latest
    # build: .
    container_name: nexcrate
    restart: unless-stopped

    ports:
      # Host port on the left, container port on the right.
      - "8390:8390"

    volumes:
      # ⚠️ A local disk, never an SMB or NFS share. SQLite's locking does not work reliably
      # over network file systems, and that is how it loses data. On a NAS use a path on an
      # internal volume, not a mounted share.
      - ./data:/data

      # Media and downloads, for loading and filing away movies. nexcrate offers only folders
      # mounted like the example below, never its own /data, so pick another path inside the
      # container, such as /media.
      #
      # ⚠️ Hardlinks work only inside one mount. Put the downloads of SABnzbd and qBittorrent and
      # the movie folders below one host folder and mount that folder once, for example
      # /srv/data/torrents, /srv/data/usenet and /srv/data/movies below /srv/data. Two mounts,
      # even of the same disk, turn every torrent into a full copy that takes its space twice.
      #
      # Your download clients may see the same folder under another path, for example /data.
      # nexcrate notices that at the first finished download and asks you once to confirm.
      # - /srv/data:/media

    environment:
      # Who owns the files in the data directory. The container fixes the rights itself.
      PUID: 1000
      PGID: 1000

      # ⚠️ The key that encrypts stored credentials such as Radarr API keys. Leaving it empty
      # is fine: nexcrate creates one on the first start and keeps it as /data/secret.key.
      # Back it up together with the data directory; without it the stored credentials
      # cannot be read.
      NEXCRATE_SECRET_KEY: ${NEXCRATE_SECRET_KEY:-}

      # Whether the session cookie may only travel over HTTPS.
      #
      #   auto   Secure when the request arrived over https (default)
      #   on     always, for a reverse proxy that ends TLS and forwards plain http
      #   off    never
      #
      # ⚠️ Do not set "on" if nexcrate is also opened over http://: the browser drops a
      # Secure cookie sent over http, and then nobody stays logged in.
      NEXCRATE_COOKIE_SECURE: ${NEXCRATE_COOKIE_SECURE:-auto}

      # Fixes the log mode: quiet, normal, detailed or trace. Empty: the mode chosen in the
      # interface. Meant for the case that nexcrate does not start at all.
      NEXCRATE_LOG_LEVEL: ${NEXCRATE_LOG_LEVEL:-}
